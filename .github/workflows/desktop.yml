name: Desktop

# Pull requests that change desktop files: install and run the tests.
# Pushes to main that change desktop files (or a manual run): also build the Windows
# installer and publish it as GitHub release v<version>, which is where the app's
# auto-updater looks. To ship an update, raise "version" in desktop/package.json.
# If that version is already released, electron-builder skips publishing it again.

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: desktop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci && npm test

  windows:
    # Pull requests build the installer to check it; only main publishes it.
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run bundle
      - name: Skip if this version is already released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          ASSETS=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null) && EXISTS=true || EXISTS=false
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          if [ "$EXISTS" = true ] && echo "$ASSETS" | grep -qx "latest.yml" && echo "$ASSETS" | grep -qx "Gale-Setup-$VERSION.exe"; then
            echo "v$VERSION is already released. Raise the version in desktop/package.json to ship an update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            # Not released yet, or a release missing its installer: build (and fill it in).
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the Windows installer
        if: steps.check.outputs.skip == 'false' || steps.check.outputs.publish == 'false'
        run: npx electron-builder --win --publish never
      - name: Check the installer files are there
        if: steps.check.outputs.skip == 'false' || steps.check.outputs.publish == 'false'
        shell: bash
        run: |
          ls -la dist
          test -f "dist/Gale-Setup-$(node -p "require('./package.json').version").exe"
          test -f dist/latest.yml
          cat dist/latest.yml
      - name: Publish the GitHub release (the auto-updater reads latest.yml from it)
        if: steps.check.outputs.skip == 'false' && steps.check.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          if [ "${{ steps.check.outputs.exists }}" = true ]; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/*.exe dist/*.exe.blockmap dist/latest.yml
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false \
              --title "Gale for Windows $TAG" \
              --notes "Download the Setup .exe below and run it. Gale updates itself after that."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Gale for Windows $TAG" \
              --notes "Download the Setup .exe below and run it. Gale updates itself after that." \
              dist/*.exe dist/*.exe.blockmap dist/latest.yml
          fi
